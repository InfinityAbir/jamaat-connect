version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jamaat_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jamaat_connect_dev}
      POSTGRES_USER: ${POSTGRES_USER:-jamaat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jamaat_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/backend/JamaatConnect.Api/Dockerfile
    container_name: jamaat_connect_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      UseDockerDb: true
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRINGS__DEFAULTCONNECTION:-Host=db;Database=${POSTGRES_DB:-jamaat_connect_dev};Username=${POSTGRES_USER:-jamaat_user};Password=${POSTGRES_PASSWORD:-jamaat_dev_password}}
      # SMTP Settings (to be overridden in .env or docker-compose.dev.yml)
      SMTP__HOST: ${SMTP_HOST:-}
      SMTP__PORT: ${SMTP_PORT:-587}
      SMTP__USERNAME: ${SMTP_USERNAME:-}
      SMTP__PASSWORD: ${SMTP_PASSWORD:-}
      SMTP__SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-noreply@jamaatconnect.example.com}
      SMTP__SENDER_NAME: ${SMTP_SENDER_NAME:-Jamaat Connect}
      SMTP__ENABLE_SSL: ${SMTP_ENABLE_SSL:-true}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: jamaat_connect_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data: